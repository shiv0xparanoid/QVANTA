[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qvanta-simulator"
version = "0.1.0"
description = "QVANTA Quantum Simulator Microservice"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
  {name = "QVANTA Team"}
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
  "redis>=5.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "numpy>=1.26"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
